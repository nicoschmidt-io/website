{{ define "main" }}
<article class="post-single">

  <header class="entry-header">
    <h1>{{ .Title }}</h1>
    <p class="meta">
      {{ .Date.Format "02 Jan 2006" }} · {{ .Params.medium }}
    </p>
  </header>

  <div class="post-content">
    {{ .Content | safeHTML }}
  </div>

</article>
{{ end }}
